schema = 1
project = "clck"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["LIBCLANG_PATH", "LD_LIBRARY_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "CC", "CXX", "BINDGEN_EXTRA_CLANG_ARGS"]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
